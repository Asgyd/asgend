openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ASGEND Remote Control Plane API
  version: 1.0.0
  description: Versioned HTTPS API for user/mobile/desktop clients and registered Execution Nodes. The Control Plane
    stores task projections, commands, events, identity and artifact metadata; it never runs the task orchestrator,
    models, tools or user workspace code. Normative rules are in `CONTRACT_SKETCH.md` and `docs/API_CONTRACT.md`.
servers:
- url: https://control-plane.example.invalid
  description: Replace with the deployment HTTPS origin. Do not expose the core TCP API directly to the Internet.
tags:
- name: System
  description: Health and operational endpoints.
- name: Authentication
  description: User/device credentials, pairing and logout.
- name: Workspaces
  description: Workspace membership and configuration.
- name: Nodes
  description: Execution Node registration and lifecycle.
- name: Tasks
  description: Task submissions, state projection and commands.
- name: Events
  description: Cursor-based event reads and reconnect support.
- name: Artifacts
  description: Immutable artifact metadata and capability-ticket downloads.
- name: Node channel
  description: Authenticated Execution Node heartbeat, commands, event ingest and artifacts.
- name: Audit
  description: Workspace audit records.
paths:
  /v1/health:
    get:
      tags:
      - System
      operationId: getHealth
      summary: Liveness check
      description: Unauthenticated liveness endpoint. Does not imply that storage is ready.
      security: []
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/requests.schema.json#/$defs/health_response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/ready:
    get:
      tags:
      - System
      operationId: getReadiness
      summary: Readiness check
      description: Unauthenticated readiness endpoint; returns unavailable when storage or migrations are not ready.
      security: []
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/requests.schema.json#/$defs/ready_response
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/metrics:
    get:
      tags:
      - System
      operationId: getMetrics
      summary: Prometheus metrics
      description: Metrics use only bounded labels; prompts, secrets and filesystem paths must not be label values.
      security:
      - metricsBearer: []
      responses:
        '200':
          description: Prometheus text exposition format.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me:
    get:
      tags:
      - Authentication
      operationId: getCurrentUser
      summary: Current user and workspace roles
      description: Current user and workspace roles
      security:
      - userBearer: []
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/workspace.schema.json#/$defs/me_response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Revoke the presenting user token
      description: Revoke the presenting user token
      security:
      - userBearer: []
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/pairing.schema.json#/$defs/logout_response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/workspaces/{ws}/pairing-codes:
    post:
      tags:
      - Authentication
      operationId: createPairingCode
      summary: Create a one-time pairing code
      description: Create a one-time pairing code
      security:
      - userBearer: []
      responses:
        '201':
          description: Pairing code created; expires in 10 minutes.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/pairing.schema.json#/$defs/pairing_code_response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        description: Request payload.
        content:
          application/json:
            schema:
              $ref: schemas/pairing.schema.json#/$defs/pairing_code_create_request
  /v1/pairing/redeem:
    post:
      tags:
      - Authentication
      operationId: redeemPairingCode
      summary: Redeem a pairing code for a user token
      description: Redeem a pairing code for a user token
      security: []
      responses:
        '201':
          description: Single-use pairing code redeemed. The returned token is shown only once.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/pairing.schema.json#/$defs/pairing_redeem_response
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        description: Request payload.
        content:
          application/json:
            schema:
              $ref: schemas/pairing.schema.json#/$defs/pairing_redeem_request
  /v1/workspaces/{ws}/nodes:
    get:
      tags:
      - Nodes
      operationId: listWorkspaceNodes
      summary: List execution nodes in a workspace
      description: List execution nodes in a workspace
      security:
      - userBearer: []
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/list.schema.json#/$defs/node_list
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/WorkspaceID'
  /v1/workspaces/{ws}/node-enrollments:
    post:
      tags:
      - Nodes
      operationId: createNodeEnrollment
      summary: Create a one-time execution-node enrollment
      description: Create a one-time execution-node enrollment
      security:
      - userBearer: []
      responses:
        '201':
          description: Enrollment code created; expires in 15 minutes.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
