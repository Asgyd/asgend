            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Content-Type:
              schema:
                type: string
              description: Artifact MIME type.
            Content-Length:
              schema:
                type: integer
                minimum: 0
            X-Checksum-SHA256:
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
            Content-Disposition:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
                const: bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
