                type: string
                pattern: ^bytes [0-9]+-[0-9]+/[0-9]+$
            Content-Type:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                minimum: 0
            X-Checksum-SHA256:
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
            Content-Disposition:
