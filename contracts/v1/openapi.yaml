      - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        description: Request payload.
        content:
          application/json:
            schema:
              $ref: schemas/pairing.schema.json#/$defs/node_enrollment_create_request
  /v1/nodes/{node}/revoke:
    post:
      tags:
      - Nodes
      operationId: revokeNode
      summary: Revoke an execution node and its credentials
      description: Revocation invalidates node tokens and expires pending commands for the node.
      security:
      - userBearer: []
      responses:
        '200':
          description: The updated node projection.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/node.schema.json#/$defs/response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/NodeID'
  /v1/workspaces/{ws}/tasks:
    post:
      tags:
      - Tasks
      operationId: submitTask
      summary: Submit a task to an execution node
      description: Creates a durable submit command; server acceptance is not proof that the execution node has
        begun work. `idempotency_key` is required.
      security:
      - userBearer: []
      responses:
        '201':
          description: Task created. A repeated idempotency key and identical body returns 200 with the original
            task.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/remote_task.schema.json#/$defs/response
        '200':
          description: Idempotent replay; the original task.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/remote_task.schema.json#/$defs/response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        description: Request payload.
        content:
          application/json:
            schema:
              $ref: schemas/requests.schema.json#/$defs/submit_task_request
    get:
      tags:
      - Tasks
      operationId: listWorkspaceTasks
      summary: List tasks in a workspace
      description: List tasks in a workspace
      security:
      - userBearer: []
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/list.schema.json#/$defs/task_list
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/TaskStateFilter'
      - $ref: '#/components/parameters/NodeFilter'
      - $ref: '#/components/parameters/PageLimit200'
      - $ref: '#/components/parameters/Cursor'
  /v1/tasks/{task}:
    get:
      tags:
      - Tasks
      operationId: getTask
      summary: Get task state
      description: Get task state
      security:
      - userBearer: []
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/remote_task.schema.json#/$defs/response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/TaskID'
  /v1/tasks/{task}/events:
    get:
      tags:
      - Events
      operationId: getTaskEvents
      summary: Read task events with cursor and long polling
      description: Returns events with event_id greater than after_event_id. Persist last_event_id and resume from
        it after reconnect; cursors can be detected as stale after restore.
      security:
      - userBearer: []
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/list.schema.json#/$defs/event_page
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/TaskID'
      - $ref: '#/components/parameters/AfterEventID'
      - $ref: '#/components/parameters/EventLimit'
      - $ref: '#/components/parameters/WaitMs'
  /v1/workspaces/{ws}/events:
    get:
      tags:
      - Events
      operationId: getWorkspaceEvents
      summary: Read workspace events with cursor and long polling
      description: Read workspace events with cursor and long polling
      security:
      - userBearer: []
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/list.schema.json#/$defs/event_page
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/AfterEventID'
      - $ref: '#/components/parameters/EventLimit'
      - $ref: '#/components/parameters/WaitMs'
  /v1/tasks/{task}/answer:
    post:
      tags:
      - Tasks
      operationId: answerTaskQuestion
      summary: Answer a task waiting for input
      description: Answer a task waiting for input
      security:
      - userBearer: []
      responses:
        '202':
          description: Answer command accepted into the durable outbox; execution is performed by the node.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/command_envelope.schema.json#/$defs/response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        description: Request payload.
        content:
          application/json:
            schema:
              $ref: schemas/requests.schema.json#/$defs/answer_request
  /v1/tasks/{task}/cancel:
    post:
      tags:
      - Tasks
      operationId: cancelTask
      summary: Request task cancellation
      description: Request task cancellation
      security:
      - userBearer: []
      responses:
        '202':
          description: Cancel command accepted; the server does not directly stop execution.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/command_envelope.schema.json#/$defs/response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        description: Request payload.
        content:
          application/json:
            schema:
              $ref: schemas/requests.schema.json#/$defs/cancel_request
  /v1/tasks/{task}/retry:
    post:
      tags:
      - Tasks
      operationId: retryTask
      summary: Retry a failed or delivery-failed task
      description: Retry a failed or delivery-failed task
      security:
      - userBearer: []
      responses:
        '202':
          description: Retry command accepted into the durable outbox.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/command_envelope.schema.json#/$defs/response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        description: Request payload.
        content:
          application/json:
            schema:
              $ref: schemas/requests.schema.json#/$defs/retry_request
  /v1/tasks/{task}/commands:
    get:
      tags:
      - Tasks
      operationId: listTaskCommands
      summary: List commands for a task
      description: List commands for a task
      security:
      - userBearer: []
      responses:
        '200':
          description: Successful response
