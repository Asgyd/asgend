          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/ArtifactID'
  /v1/node/artifacts/{art}/complete:
    post:
      tags:
      - Node channel
      operationId: completeNodeArtifactUpload
      summary: Verify SHA-256 and finalize artifact upload
      description: The server verifies full byte count and SHA-256. Mismatch deletes staged content and marks the
        upload rejected.
      security:
      - nodeBearer: []
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-ASGEND-API-Version:
              $ref: '#/components/headers/XApiVersion'
          content:
            application/json:
              schema:
                $ref: schemas/artifact.schema.json#/$defs/response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/ArtifactID'
      requestBody:
        required: false
        description: Request payload.
        content:
          application/json:
            schema:
              $ref: schemas/requests.schema.json#/$defs/empty_request
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: ucp_…
      description: User/device access token. Only a SHA-256 hash is stored server-side; token is returned only at
        issuance.
    nodeBearer:
      type: http
      scheme: bearer
      bearerFormat: ncp_…
      description: Execution Node token, separate from user credentials.
    metricsBearer:
      type: http
      scheme: bearer
      bearerFormat: configured metrics token
      description: Bearer token configured with ASGEND_CP_METRICS_TOKEN.
    downloadTicket:
      type: http
      scheme: bearer
      bearerFormat: dlt_…
      description: Capability token for one artifact and issuing user. Because the implementation places it in the
        URL path, the download operation documents it as a required sensitive path parameter and uses an explicit
        empty security requirement; do not place the URL in logs or analytics.
  parameters:
    WorkspaceID:
      name: ws
      in: path
      required: true
      description: Workspace identifier.
      schema:
        $ref: schemas/common.schema.json#/$defs/workspace_id
    TaskID:
      name: task
      in: path
      required: true
      description: Remote task identifier, not the local core task identifier.
      schema:
        $ref: schemas/common.schema.json#/$defs/task_id
    NodeID:
      name: node
      in: path
      required: true
      schema:
        $ref: schemas/common.schema.json#/$defs/node_id
    ArtifactID:
      name: art
      in: path
      required: true
      schema:
        $ref: schemas/common.schema.json#/$defs/artifact_id
    CommandID:
      name: cmd
      in: path
      required: true
      schema:
        $ref: schemas/common.schema.json#/$defs/command_id
    DownloadTicket:
      name: ticket
      in: path
      required: true
      description: Secret capability token; do not log or expose it.
      schema:
        $ref: schemas/common.schema.json#/$defs/download_ticket
    TaskStateFilter:
      name: state
      in: query
      required: false
      schema:
        $ref: schemas/common.schema.json#/$defs/task_state
    NodeFilter:
      name: node_id
      in: query
      required: false
      schema:
        $ref: schemas/common.schema.json#/$defs/node_id
    PageLimit200:
      name: limit
      in: query
      required: false
      description: Page size, 1..200 (default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    EventLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1..500 (default 100).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor; do not parse it.
      schema:
        $ref: schemas/common.schema.json#/$defs/cursor
    AfterEventID:
      name: after_event_id
      in: query
      required: false
      description: Resume after this server event ID; 0 means the beginning.
      schema:
        $ref: schemas/common.schema.json#/$defs/event_cursor
    WaitMs:
      name: wait_ms
      in: query
      required: false
      description: Long-poll duration in milliseconds.
      schema:
        type: integer
        minimum: 0
        maximum: 30000
        default: 0
    AuditLimit:
      name: limit
      in: query
      required: false
      description: Page size (default 50; service-defined maximum).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    RangeHeader:
      name: Range
      in: header
      required: false
      description: Single byte range; unsupported/malformed multi-range values are ignored and full content is served.
      schema:
        type: string
        pattern: ^bytes=(\d*-\d*)$
    ContentRangeHeader:
      name: Content-Range
      in: header
      required: true
      description: Chunk range and declared total length.
      schema:
        type: string
        pattern: ^bytes [0-9]+-[0-9]+/[0-9]+$
  headers:
    XRequestID:
      description: Correlation ID for support and logs; never put credentials in this header.
      schema:
        type: string
        maxLength: 64
    XApiVersion:
      description: Major API version.
      schema:
        type: string
        const: '1'
  responses:
    BadRequest:
      description: The request is invalid or a required field is missing.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-ASGEND-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: schemas/error.schema.json
    Unauthorized:
      description: Missing, invalid or revoked credential.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-ASGEND-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: schemas/error.schema.json
    Forbidden:
      description: The credential is valid but the requested action is not permitted.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-ASGEND-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: schemas/error.schema.json
    NotFound:
      description: The object was not found or is outside the caller’s visible workspace.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-ASGEND-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: schemas/error.schema.json
    Conflict:
      description: The request conflicts with the current task, command, or upload state.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-ASGEND-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: schemas/error.schema.json
    Gone:
      description: The object or short-lived ticket expired.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-ASGEND-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: schemas/error.schema.json
    PayloadTooLarge:
      description: The request or upload chunk exceeds a configured limit.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-ASGEND-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: schemas/error.schema.json
    RangeNotSatisfiable:
      description: The requested byte range is not satisfiable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-ASGEND-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: schemas/error.schema.json
    Unprocessable:
      description: The artifact checksum or size does not match the declared upload.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-ASGEND-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: schemas/error.schema.json
    RateLimited:
      description: The caller has exceeded a rate limit or quota and may retry later.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-ASGEND-API-Version:
          $ref: '#/components/headers/XApiVersion'
        Retry-After:
          description: Suggested delay before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: schemas/error.schema.json
    InternalError:
      description: Unexpected server error; details do not contain secrets or filesystem paths.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-ASGEND-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: schemas/error.schema.json
    Unavailable:
      description: The service is unavailable or is not ready.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-ASGEND-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: schemas/error.schema.json
  schemas:
    UploadProgress:
      type: object
      required:
      - api_version
      - artifact_id
      - received
      - size
      properties:
        api_version:
          $ref: schemas/common.schema.json#/$defs/api_version
        artifact_id:
          $ref: schemas/common.schema.json#/$defs/artifact_id
        received:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 0
        state:
          $ref: schemas/common.schema.json#/$defs/artifact_state
      description: Chunk upload progress returned by a successful PUT; the GET status schema also reports upload
        state.
    ApiVersionOnly:
      type: object
      required:
      - api_version
      properties:
        api_version:
          $ref: schemas/common.schema.json#/$defs/api_version
      additionalProperties: true
