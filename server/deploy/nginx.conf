# TLS termination sample. Mount your real fullchain.pem and privkey.pem read-only.
# The Control Plane enforces ASGEND_CP_ALLOWED_HOSTS independently of this proxy.

# Download tickets are bearer capabilities carried in the URL path; never write
# them to the access log. Other paths contain only opaque resource ids.
map $request_uri $asgend_log_uri {
    ~^/v1/downloads/  /v1/downloads/[redacted];
    default           $request_uri;
}
log_format asgend '$remote_addr - [$time_local] "$request_method $asgend_log_uri $server_protocol" '
                  '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /dev/stdout asgend;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    access_log /dev/stdout asgend;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ASGEND:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
    proxy_request_buffering off;

    location / {
        proxy_pass http://control-plane:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
